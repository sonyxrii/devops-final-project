name: Final Project CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Завантажити код репозиторію
        uses: actions/checkout@v4

      - name: Авторизація у Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Збірка та пуш Docker образу
        uses: docker/build-push-action@v5
        with:
          context: ./students/sonya
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/devops-final-app:latest

      - name: Встановлення Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init та Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cd students/sonya/infra
          terraform init
          terraform apply -auto-approve
      - name: Деплой на AWS EC2 по SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          mkdir -p students/sonya/infra
          echo "$SSH_PRIVATE_KEY" | base64 -d > students/sonya/infra/ec2-key.pem
          chmod 600 students/sonya/infra/ec2-key.pem
          cd students/sonya/infra
          INSTANCE_IP=$(terraform output -raw instance_ip)
          cd ../../..

          echo "Waiting 30 seconds for AWS instance to boot up..."
          sleep 30

          echo "Connecting to $INSTANCE_IP..."

          ssh -o StrictHostKeyChecking=no -i students/sonya/infra/ec2-key.pem ubuntu@$INSTANCE_IP << 'EOF'
            sudo apt-get update -y
            sudo apt-get install -y docker.io
            sudo systemctl start docker
            sudo systemctl enable docker

            sudo docker stop devops-app || true
            sudo docker rm devops-app || true
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/devops-final-app:latest
            sudo docker run -d --name devops-app -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/devops-final-app:latest
          EOF
